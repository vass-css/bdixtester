name: Catalog Live Verification (Optional)

on:
  workflow_dispatch:
    inputs:
      recheck_hours:
        description: Minimum hours between repeated checks before candidate promotion
        required: false
        default: '24'
      max_workers:
        description: Maximum concurrent verification workers (1-8)
        required: false
        default: '6'
      isp_probes_path:
        description: Optional path to external Bangladesh ISP probe JSON file
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: catalog-live-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-verify:
    name: Conservative Public DNS, RDAP & Endpoint Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate offline catalog invariants
        run: python3 -m tools.catalog_verifier validate-catalog --repo-root .

      - name: Run conservative live catalog verification
        env:
          RECHECK_HOURS: ${{ inputs.recheck_hours || '24' }}
          MAX_WORKERS: ${{ inputs.max_workers || '6' }}
          ISP_PROBES_PATH: ${{ inputs.isp_probes_path || '' }}
        run: |
          mkdir -p build/reports/catalog-audit
          extra_args=()
          if [[ -n "$ISP_PROBES_PATH" && -f "$ISP_PROBES_PATH" ]]; then
            python3 -m tools.catalog_verifier validate-isp-probes --input "$ISP_PROBES_PATH"
            extra_args+=(--isp-probes "$ISP_PROBES_PATH")
          fi
          python3 -m tools.catalog_verifier verify-live \
            --repo-root . \
            --recheck-hours "$RECHECK_HOURS" \
            --max-workers "$MAX_WORKERS" \
            --timeout 4.0 \
            --domain-delay 0.05 \
            --env-note "GitHub Actions ubuntu-latest (external network; no BDIX peering)" \
            --json-out build/reports/catalog-audit/catalog-audit-report.json \
            --md-out build/reports/catalog-audit/catalog-audit-report.md \
            "${extra_args[@]}"

      - name: Publish audit summary
        if: always() && hashFiles('build/reports/catalog-audit/catalog-audit-report.md') != ''
        run: |
          cat build/reports/catalog-audit/catalog-audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-live-verification-report
          path: |
            build/reports/catalog-audit/catalog-audit-report.json
            build/reports/catalog-audit/catalog-audit-report.md
          if-no-files-found: warn
          retention-days: 30
