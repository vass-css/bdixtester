name: Android Release

on:
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/bdixtester-release.p12
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in the android-release environment."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env STORE_PASSWORD -alias upload >/dev/null
          chmod +x gradlew

          ./gradlew --no-daemon \
            :app:ktlintCheck \
            :app:testDebugUnitTest \
            :app:lintVitalRelease \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify release APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Release APK not found at $APK."
            exit 1
          fi
          if ! VERIFY_OUT="$("$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK" 2>&1)"; then
            printf '%s\n' "$VERIFY_OUT"
            echo "::error::apksigner failed to verify the release APK."
            exit 1
          fi
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUT" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/ip' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="E21B27621C998650B57FF7C749A263F5292BB2E17D1FBB4F08591E3A8B69AA7A"
          if [[ -z "$CERT_SHA256" ]]; then
            printf '%s\n' "$VERIFY_OUT"
            echo "::error::apksigner did not return a certificate SHA-256 digest."
            exit 1
          fi
          if [[ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate does not match the existing upload certificate (expected $EXPECTED_CERT_SHA256, got $CERT_SHA256)."
            exit 1
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/bdixtester-release.p12"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: bdixtester-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
          if-no-files-found: warn

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release '$GITHUB_REF_NAME' already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --verify-tag \
            --generate-notes
