name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Select the manual CI workload
        type: choice
        options:
          - performance
          - full
        default: performance
        required: true

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Java
        id: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Record Gradle dependency cache status
        if: always()
        env:
          GRADLE_CACHE_HIT: ${{ steps.setup-java.outputs.cache-hit }}
        run: |
          printf '%s\n' "Gradle dependency cache exact hit: \`${GRADLE_CACHE_HIT:-unavailable}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install formatter dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        run: npm ci

      - name: Check formatting
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        run: npm run format:check

      - name: Generate debug keystore
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        run: |
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Performance Benchmarks
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'performance'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --profile \
            :app:testDebugUnitTest \
            --tests 'com.jubayerhossain.bdixtester.PerformanceBenchmarkTest'

      - name: Build and Run Checks
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
        run: |
          chmod +x gradlew
          ./gradlew --continue --stacktrace --warning-mode all --profile \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:compileReleaseKotlin

      - name: Generate test timing reports
        if: always() && steps.checkout.outcome == 'success'
        env:
          TEST_CLASS_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'performance' && 'com.jubayerhossain.bdixtester.PerformanceBenchmarkTest' || '' }}
        run: |
          filter_args=()
          if [[ -n "$TEST_CLASS_FILTER" ]]; then
            filter_args+=(--class-filter "$TEST_CLASS_FILTER")
          fi
          python3 .github/scripts/summarize_gradle_test_results.py \
            --results-dir app/build/test-results/testDebugUnitTest \
            --sources-dir app/src/test \
            --output app/build/reports/test-method-timings.csv \
            --metrics-output app/build/reports/benchmark-metrics.csv \
            "${filter_args[@]}"

      - name: Upload APK and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdix-tester-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
            build/reports/profile/
          if-no-files-found: warn
          retention-days: 14
